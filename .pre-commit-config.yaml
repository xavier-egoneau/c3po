repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Garde-fou : empêche de committer un gros fichier par erreur (ex. un .gguf
      # qui aurait échappé au .gitignore). Les modèles ne vont pas dans le dépôt.
      - id: check-added-large-files
        args: ["--maxkb=2048"]
