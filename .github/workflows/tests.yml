name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # La suite de tests est de la *logique pure* : llama_cpp n'est importé que
      # paresseusement (au chargement réel d'un modèle), jamais à la collecte. On
      # installe donc le package sans sa dépendance lourde llama-cpp-python (pas de
      # build), plus les quelques deps réellement utilisées par les tests.
      # Les chemins GPU / inférence / réseau (HF) ne sont pas couverts ici : ils
      # nécessitent un GPU et un modèle, et restent validés manuellement (cf. CONTEXT.md).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic
          pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -v
